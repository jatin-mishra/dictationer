review:
  approval: "Plan approved (MVP); spec G2 approved by user ('approved')."
  results: "make test: 755 passed, 2 skipped (baseline 574 + 181 new incl. parametrized); ruff + format clean; mypy strict clean (38 files); WS tests 5/5 repeat runs green"
  e2e_live_ws: "Real MLX Whisper, `say` speech with 1.2 s pauses streamed in real time: 5 sentences -> 5 finals, each ~0.6-0.9 s after the pause; stop -> tail final + done; page content == the 5 sentences in order"
  e2e_rest_compare: "Same 33.9 s `say` clip, real Whisper. pause: 4 cuts all inside pauses, text matches the script. fixed (main): ~15 words dropped by overlap merge ('leave now. A man in a grey coat ... leather case.') and stray periods at sliced words"
  behaviour_vs_main:
    - "POST /v1/dictations: audio with a pause in the last 3 s before a 10 s mark is cut there with no overlap; otherwise identical to main (PS-10, all LA-* green). SEGMENT_STRATEGY=fixed == main"
    - "get_chapter_store / get_transcriber_router annotated HTTPConnection (was Request) so the WS route shares them; no behaviour change"
    - "TranscriberRouter.engine_for added (additive)"
  test_fixes_during_impl:
    - "SG-07 probe index: pre-roll is whole 30 ms frames, so the tone starts 0.31 s into the clip, not 0.30 s. Spec unchanged"
    - "PA-02 asserts merge() never receives texts from both sides of a pause cut (merge still runs per group, to keep main's whitespace flattening for single segments)"
  follow_ups:
    - "Deferred (MVP): backpressure queue, busy-retry, session limits/idle timeout, adaptive noise floor, partials, Opus input, query-param auth for browsers"
    - "Energy threshold 0.003 may never see silence in a noisy room -> live falls back to 20 s cuts, REST to overlap windows"
  addendum_partials_and_browser_auth:
    request: "User: 'it must continuously show text being spoken' -> 'implement that'; '2. yes' (partials for hi/hinglish too), '3. web app'"
    spec: "metric/pause_split_and_live_test_cases.yml addendum SG-09, LP-01..06, LH-01..04 (frozen cases untouched)"
    design: "start.partials (default false = existing clients unchanged): every +1 s of an open utterance (speech ongoing, >= 9 voiced frames), one background transcription of the audio so far -> {type: partial}; never stored; dropped if its utterance was finalised; failures ignored; in-flight partial awaited before the tail/at exit (MLX thread can't be cancelled). start.author_id for browsers; header still works; both must match"
    results: "766 passed, 2 skipped (+11); ruff + mypy strict clean; WS tests 10/10 repeat runs green"
    e2e: "Real Whisper, 9 s sentence streamed in real time, no header + author_id in start: 7 partials ~1.1 s apart, growing text, then final ~1.8 s after speech end; partial mistakes ('had ever seen it.') corrected by the final; 2nd sentence partial + final; done"
    behaviour_vs_main: "No partials unless requested; LV-01..11 unchanged. author-id validation now happens after reading start (same error code, still before ready)"
  bugfix_invented_text_while_silent:
    report: "User: lines never spoken were written ('Do not change anything from what is spoken.', 'Thank you.', a repeated loop) while 'silent from my side'"
    root_cause: "Reproduced: mic room noise (RMS ~0.005-0.01) > fixed 0.003 loudness threshold -> silence treated as speech -> 20 s noise clips -> Whisper invents text on noise (no_speech_prob 0.00), echoing VERBATIM_PROMPT"
    fix: "Live speech detection = Silero VAD (faster-whisper's bundled silero_vad_v6.onnx via onnxruntime; both already installed; ~0.2 ms/frame). Pluggable SpeechDetector (SileroSpeech | EnergySpeech), setting live_vad=silero default. Segmenter constants now in ms (frame counts identical for the 30 ms energy frame)"
    tests: "VAD-01..06 added (spec addendum); conftest pins LIVE_VAD=energy because tone fixtures are non-speech to Silero; frozen SG/LV expectations unchanged. 816 passed, 5 skipped (+8; baseline 808 incl. separate instructions-v2 work); ruff + mypy strict clean"
    e2e: "Real Whisper, Silero on: 15 s silent-mic noise -> done{utterances:0}, no Whisper call; same noise under 5 spoken sentences -> 5 exact finals + partials"
    follow_ups:
      - "Invented lines already stored in data/jatin_01/power-of-persistence/manuscript.md: not touched (user data)"
      - "VERBATIM_PROMPT (MW-07) is what Whisper echoes on non-speech and had no measured benefit: propose removing it"
      - "REST /v1/dictations still uses the loudness check (is_silent / pause search): a silent noisy upload can still hallucinate"

