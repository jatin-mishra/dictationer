[project]
name = "dictationer"
version = "0.1.0"
description = "FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "av>=19.0.1",
    "fastapi[standard]>=0.115",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "pyttsx3>=2.99",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mlx_whisper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: needs the real MLX Whisper model (deselect with -m 'not slow')",
    "llm: calls the real Anthropic API and costs money (opt-in: RUN_LLM_TESTS=1)",
]
