addendum_test_cases:
  - {id: IR-01, scenario: "reported गोदान page-2 output (3 updates)", expect: "update का परिणाम→की देन (old_text set); update असफलता, अनिश्चितता→संघर्ष, असमंजस; 3rd becomes remove 'वास्तविक '; applied text correct"}
  - {id: IR-02, scenario: update that only inserts words, expect: action add}
  - {id: IR-03, scenario: update that only drops words, expect: action remove}
  - {id: IR-04, scenario: plain update, expect: "old_text == content[from:to]; new_size == len(text)"}
  - {id: IR-05, scenario: update whose words are unchanged (whitespace only), expect: unresolved no_change}
  - {id: IR-06, scenario: update to empty text, expect: remove of the quote}
  - {id: IR-07, scenario: /accept update with old_text, expect: "match → applied; mismatch → 422 invalid_edit; omitted → still accepted (backward compatible)"}
  - {id: IR-08, scenario: /instructions update in API response, expect: old_text present; /accept of that block succeeds}
