# Status: APPROVED 2026-10-20 — FROZEN. Frozen once approved; any change needs explicit user review + approval.
# Design: /Users/jatinmishra/.claude/plans/tell-me-plan-for-zazzy-lemon.md (MVP scope)
# Part A: POST /v1/dictations splits long audio at pauses (no overlap at those cuts); falls back
#         to today's 10s/2s overlap window when no pause is found.
# Part B: new, independent WS /v1/dictations/live: PCM16 LE 16 kHz mono in -> one `final` per
#         utterance out; each utterance appended to the book immediately.
# Numbers below were computed by running a prototype of the exact rule (lesson L1), not by hand.
#
# Pause rule (shared): 30 ms frames (480 samples) on a grid from the clip start;
#   frame silent  <=> RMS < silence_rms_threshold (0.003).
# Part A rule: for each cut, search frames lying fully inside [start+segment_s-3s, start+segment_s);
#   take the minimum-RMS frame (ties -> the latest); if it is silent, cut at that frame's midpoint
#   (next segment starts at the cut, no overlap); otherwise cut at start+segment_s and step back
#   overlap_s (today's behaviour). Clips <= segment_s + tolerance are never split (as today).
# Part B rule: speech starts on the first voiced frame (300 ms pre-roll kept); an utterance ends after
#   600 ms (20 frames) of silence (that silence is kept in the clip); hard cap 20 s; an utterance with
#   < 9 voiced frames (~250 ms) is dropped; flush() returns the buffered tail.
# Fixtures: tone = 440 Hz sine, amplitude 0.3; silence = zeros. Defaults: segment 10 s, overlap 2 s,
#   tolerance 0.25 s. Cut lists are (start_s, end_s, overlaps_previous).

success_metrics:
  - {id: PLM1, desc: All test cases below pass (make test), target: 100%}
  - {id: PLM2, desc: "Existing test suite passes unchanged (LS-*, LA-* etc.)", target: 100%}
  - {id: PLM3, desc: "Audio without pauses: identical segments and text to main", target: exact}
  - {id: PLM4, desc: ruff + mypy strict clean, target: 0 errors}
  - {id: PLM5, desc: "Manual: 3 spoken sentences with pauses over WS -> 3 finals, persisted in order", target: pass}

failure_criteria:
  - an audio sample missing from every segment, or duplicated across a pause cut
  - text duplicated or dropped at a pause cut
  - transcript_merge applied across a pause cut (or skipped across an overlap cut)
  - segment_strategy=fixed differs from main in any way
  - REST /v1/dictations request/response contract changes
  - WS writes text for an utterance that failed transcription
  - WS loses already-buffered speech when the client disconnects without `stop`

