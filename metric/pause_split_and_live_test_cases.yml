  # ───────── Addendum 2026-10-20: live partials (user: "implement that"; partials for all languages: "2. yes") ─────────
  # Rule: start.partials (bool, default false: existing clients unchanged). While an utterance is open
  # and has >= 9 voiced frames, every +1 s of utterance audio (if no partial is in flight) the audio
  # so far is transcribed in the background and sent as {"type":"partial","text"}. Partials are never
  # written to the book. A partial whose utterance has already been finalised is dropped (never sent
  # after that utterance's final). A failed partial is ignored (best effort); the session continues.
  - {id: SG-09, scenario: "pending() during silence / 1.5 s into a tone / after the utterance ends", expect: "None / clip of the open audio (>= 1.5 s) / None; utterance counter +1 per ended utterance (kept or dropped)"}
  - {id: LP-01, scenario: "en, partials=true, tone 3 s + silence 1 s, stop", expect: "ready, >= 1 partial 'Hello world.', then final, then done; every partial precedes the final; page == 'Hello world.' once"}
  - {id: LP-02, scenario: "partials omitted (default) with the same audio", expect: "no partial messages (ready, final, done)"}
  - {id: LP-03, scenario: "hi, partials=true", expect: "partials sent (routed to the Sarvam fake)"}
  - {id: LP-04, scenario: "partial transcription slower than the utterance (fake sleeps 0.3 s on the partial call)", expect: "stale partial dropped: messages ready, final, done only"}
  - {id: LP-05, scenario: "transcriber raises on the partial call only", expect: "session continues: final + done; nothing extra written"}
  - {id: LP-06, scenario: "tone 0.8 s + silence 1 s with partials=true", expect: "no partial (utterance never reaches 1 s)"}
