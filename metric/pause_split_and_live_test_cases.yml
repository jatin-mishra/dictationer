  # ───────── Bug fix 2026-10-20: invented text while the author was silent ─────────
  # Report: lines never spoken were written ("Do not change anything from what is spoken.", "Thank you.",
  # a repeated loop) while the mic was silent. Root cause (reproduced): mic room noise (RMS ~0.005-0.01)
  # is above the fixed 0.003 loudness threshold, so silence was treated as speech (20 s noise clips),
  # and Whisper invents text on noise, echoing its initial_prompt. Fix: live speech detection uses
  # Silero VAD (bundled in faster-whisper; noise up to RMS 0.1 -> 0% speech, real speech ~67%).
  # Setting live_vad: silero (default) | energy. Frozen SG/LV cases keep their exact numbers with the
  # energy detector (tests pin LIVE_VAD=energy: tones are not speech to Silero).
  - {id: VAD-01, scenario: "Silero segmenter: 5 s white noise at RMS 0.005, 0.01, 0.03", expect: "0 clips, flush() None (the reported bug)"}
  - {id: VAD-02, scenario: "Silero segmenter: 3 s 440 Hz tone", expect: "0 clips"}
  - {id: VAD-03, scenario: "Silero segmenter: macOS `say` speech, 2 sentences with a 1.2 s pause (skipped without `say`)", expect: "2 clips; with RMS 0.01 noise added: still 2 clips"}
  - {id: VAD-04, scenario: "Silero segmenter: VAD-03 speech fed whole vs in 1000-sample chunks", expect: "identical clips"}
  - {id: VAD-05, scenario: "WS with live_vad=silero, partials=true: 10 s of RMS 0.01 noise, stop", expect: "ready, done{utterances:0}; transcriber never called; nothing written"}
  - {id: VAD-06, scenario: "default Settings()", expect: "live_vad == 'silero'; LIVE_VAD=other -> ValidationError"}
